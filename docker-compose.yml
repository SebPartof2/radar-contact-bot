# RC Notify — Discord bot + web dashboard in one service.
#
# Local use:
#   1. cp .env.example .env  &&  edit it
#   2. docker compose --env-file .env up --build
#   3. open http://localhost:3000
#
# On Dokploy: deploy this compose file and set the same variables in the service's
# Environment panel. Dokploy's proxy handles the domain/HTTPS — point the domain at
# service "rc-notify", port 3000. The published port below is only used for local runs.

services:
  rc-notify:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      # Set both of these to turn on the web dashboard.
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      # The container always listens on 3000; this is the port the Dokploy domain targets.
      PORT: 3000
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      MISSED_POLLS_BEFORE_OFFLINE: ${MISSED_POLLS_BEFORE_OFFLINE:-2}
      DATABASE_PATH: /data/rcnotify.sqlite
      TZ: ${TZ:-UTC}
    # No published port: Dokploy's proxy reaches the container directly on 3000. Publishing to
    # the host is what caused "port is already allocated", and it is only useful locally —
    # docker-compose.override.yml does that, and Compose ignores it when a file is passed with -f.
    volumes:
      - rc-notify-data:/data

volumes:
  rc-notify-data:
