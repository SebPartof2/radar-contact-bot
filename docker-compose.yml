services:
  rc-notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rc-notify
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      # Set these two to turn on the web dashboard.
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      BASE_URL: ${BASE_URL:-}
      PORT: ${PORT:-3000}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      MISSED_POLLS_BEFORE_OFFLINE: ${MISSED_POLLS_BEFORE_OFFLINE:-2}
      DATABASE_PATH: /data/rcnotify.sqlite
      TZ: ${TZ:-UTC}
    ports:
      # Point the Dokploy domain at this port. Change PORT if 3000 is taken on the host.
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - rc-notify-data:/data

volumes:
  rc-notify-data:
