services:
  rc-notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rc-notify
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      # Set these two to turn on the web dashboard.
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      BASE_URL: ${BASE_URL:-}
      PORT: ${PORT:-3000}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      MISSED_POLLS_BEFORE_OFFLINE: ${MISSED_POLLS_BEFORE_OFFLINE:-2}
      DATABASE_PATH: /data/rcnotify.sqlite
      TZ: ${TZ:-UTC}
    # Traefik reaches the container over dokploy-network, so the port only needs to be exposed,
    # not published to the host. Point the Dokploy domain at this same port.
    expose:
      - "${PORT:-3000}"
    volumes:
      - rc-notify-data:/data
    networks:
      - dokploy-network

volumes:
  rc-notify-data:

# Created by Dokploy itself; Traefik can only route to containers attached to it.
networks:
  dokploy-network:
    external: true
